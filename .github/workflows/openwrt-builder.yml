name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  CONFIG_FILE: .config
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@main
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential bison flex gawk gettext ncurses-dev libssl-dev zlib1g-dev rsync unzip wget git python3 python3-distutils file qemu-utils
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    - name: Customize config
      run: |
        cp $CONFIG_FILE openwrt/.config
        cd openwrt
        make defconfig
    - name: Download packages
      run: |
        cd openwrt
        make download -j$(nproc) V=s 2>&1 | tail -20
    - name: Build firmware
      run: |
        cd openwrt
        make -j$(nproc) V=s 2>&1 | tail -30
    - name: Upload firmware
      uses: actions/upload-artifact@main
      with:
        name: OpenWrt-firmware
        path: openwrt/bin/targets/*/*/
